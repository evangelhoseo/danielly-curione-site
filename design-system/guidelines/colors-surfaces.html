<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0; display:flex; gap:2px">
<div style="flex:1; height:100px; background:var(--color-cream); display:flex; align-items:end; padding:8px; font:11px var(--font-body); color:var(--text-body)">cream page</div>
<div style="flex:1; height:100px; background:var(--color-cream-panel); display:flex; align-items:end; padding:8px; font:11px var(--font-body); color:var(--text-body)">panel</div>
<div style="flex:1; height:100px; background:var(--color-wood); display:flex; align-items:end; padding:8px; font:11px var(--font-body); color:var(--text-body)">wood accent</div>
<div style="flex:1; height:100px; background:var(--color-chip); display:flex; align-items:end; padding:8px; font:11px var(--font-body); color:var(--text-body)">chip</div>
</body></html>
